name: Windows builds and tests

on:
  push:
    branches-ignore:
      - 'ci/**'
      - 'repair/**'
  pull_request:
  workflow_dispatch:

jobs:
  build-test-package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86 compatibility
            runner: windows-2022
            platform: Win32
            test_platform: x86
            package_platform: x86
            triplet: x86-windows
            artifact: windows-x86
            host_architecture: x64
            expected_host: HostX64
          - name: Windows x64 compatibility
            runner: windows-2022
            platform: x64
            test_platform: x64
            package_platform: x64
            triplet: x64-windows
            artifact: windows-x64
            host_architecture: x64
            expected_host: HostX64
          - name: Native Windows ARM64
            runner: windows-11-arm
            platform: ARM64
            test_platform: ARM64
            package_platform: ARM64
            triplet: arm64-windows
            artifact: windows-arm64
            host_architecture: arm64
            expected_host: Hostarm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Record runner architecture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts\logs | Out-Null
          @(
            "OS=$([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
            "OSArchitecture=$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
            "ProcessArchitecture=$([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
            "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          ) | Tee-Object artifacts\logs\environment-${{ matrix.platform }}.txt
          if ("${{ matrix.platform }}" -eq "ARM64" -and
              [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne "Arm64") {
            throw "The ARM64 job is not running on a native ARM64 operating system."
          }

      - name: Verify fail-closed test accounting
        shell: pwsh
        run: |
          .\Build\Scripts\Test-TestResults.ps1
          .\Build\Scripts\Test-ToolchainValidation.ps1
          .\Build\Scripts\Test-Arm64ProjectGraph.ps1
          .\Build\Scripts\Test-SourceEncoding.ps1

      - name: Cache installed dependencies
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-v143-14.44.35207-sdk-10.0.26100.0-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Restore pinned dependencies
        shell: pwsh
        run: |
          . .\Build\Scripts\InitializeBuildEnvironment.ps1 `
            -Platform ${{ matrix.platform }} `
            -RequiredVCToolsVersion 14.44.35207 `
            -RequiredWindowsSdkVersion 10.0.26100.0 `
            -PreferredToolArchitecture ${{ matrix.host_architecture }} `
            -LogPath artifacts\logs\toolchain-restore-${{ matrix.platform }}.log
          & .\InstallThirdPartyLibraries.ps1 -Triplet ${{ matrix.triplet }} 2>&1 |
            Tee-Object artifacts\logs\restore-${{ matrix.platform }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Debug
        shell: pwsh
        run: |
          . .\Build\Scripts\InitializeBuildEnvironment.ps1 `
            -Platform ${{ matrix.platform }} `
            -RequiredVCToolsVersion 14.44.35207 `
            -RequiredWindowsSdkVersion 10.0.26100.0 `
            -PreferredToolArchitecture ${{ matrix.host_architecture }} `
            -LogPath artifacts\logs\toolchain-Debug-${{ matrix.platform }}.log
          & "$env:MSBUILD_EXE" /m CppCoverage.sln /p:Configuration=Debug /p:Platform=${{ matrix.platform }} `
            /p:PlatformToolset=v143 `
            /p:PreferredToolArchitecture=${{ matrix.host_architecture }} `
            /p:VCToolsVersion=14.44.35207 `
            /p:WindowsTargetPlatformVersion=10.0.26100.0 `
            /bl:artifacts\logs\build-Debug-${{ matrix.platform }}.binlog `
            /fl "/flp:logfile=artifacts\logs\build-Debug-${{ matrix.platform }}.log;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # MSBuild chooses its host toolchain independently of what the preflight
      # probed. On the ARM64 runner it silently used the emulated HostX86
      # compiler while vcpkg had used Hostarm64, so the shipped binaries were
      # not built by the toolchain that was verified.
      - name: Verify build host toolchain (Debug)
        shell: pwsh
        run: |
          & .\Build\Scripts\Assert-BuildToolchain.ps1 `
            -BuildLog artifacts\logs\build-Debug-${{ matrix.platform }}.log `
            -ExpectedHost ${{ matrix.expected_host }} `
            -SummaryPath artifacts\logs\build-toolchain-Debug-${{ matrix.platform }}.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests (Debug)
        shell: pwsh
        run: |
          & .\Build\Scripts\RunTests.ps1 -Platform ${{ matrix.test_platform }} `
            -Configuration Debug -LogDirectory artifacts\logs

      - name: Run end-to-end coverage oracle
        shell: pwsh
        run: |
          & .\Build\Scripts\Run-E2ECoverage.ps1 -Platform ${{ matrix.test_platform }} `
            -Configuration Debug -LogDirectory artifacts\logs

      - name: Build Release
        shell: pwsh
        run: |
          . .\Build\Scripts\InitializeBuildEnvironment.ps1 `
            -Platform ${{ matrix.platform }} `
            -RequiredVCToolsVersion 14.44.35207 `
            -RequiredWindowsSdkVersion 10.0.26100.0 `
            -PreferredToolArchitecture ${{ matrix.host_architecture }} `
            -LogPath artifacts\logs\toolchain-Release-${{ matrix.platform }}.log
          & "$env:MSBUILD_EXE" /m CppCoverage.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }} `
            /p:PlatformToolset=v143 `
            /p:PreferredToolArchitecture=${{ matrix.host_architecture }} `
            /p:VCToolsVersion=14.44.35207 `
            /p:WindowsTargetPlatformVersion=10.0.26100.0 `
            /bl:artifacts\logs\build-Release-${{ matrix.platform }}.binlog `
            /fl "/flp:logfile=artifacts\logs\build-Release-${{ matrix.platform }}.log;verbosity=normal"

      - name: Verify build host toolchain (Release)
        shell: pwsh
        run: |
          & .\Build\Scripts\Assert-BuildToolchain.ps1 `
            -BuildLog artifacts\logs\build-Release-${{ matrix.platform }}.log `
            -ExpectedHost ${{ matrix.expected_host }} `
            -SummaryPath artifacts\logs\build-toolchain-Release-${{ matrix.platform }}.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and verify
        shell: pwsh
        run: |
          & .\CreateRelease.ps1 -Platform ${{ matrix.package_platform }} -Configuration Release 2>&1 |
            Tee-Object artifacts\logs\package-${{ matrix.platform }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checksums = @(Get-ChildItem artifacts\*.zip.sha256 -File -ErrorAction Stop)
          if ($checksums.Count -ne 1) {
            throw "Expected exactly one package checksum, found $($checksums.Count)."
          }
          $checksum = $checksums[0]
          $expected = ((Get-Content -LiteralPath $checksum.FullName -Raw) -split '\s+')[0]
          $zip = $checksum.FullName -replace '\.sha256$', ''
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Package checksum mismatch for $zip."
          }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.artifact }}
          path: artifacts/logs

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: OpenCppCoverage-${{ matrix.artifact }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*-expanded-pe-manifest.json
