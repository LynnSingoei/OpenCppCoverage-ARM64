name: Windows builds and tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test-package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86 compatibility
            runner: windows-2022
            platform: Win32
            test_platform: x86
            package_platform: x86
            triplet: x86-windows
            artifact: windows-x86
          - name: Windows x64 compatibility
            runner: windows-2022
            platform: x64
            test_platform: x64
            package_platform: x64
            triplet: x64-windows
            artifact: windows-x64
          - name: Native Windows ARM64
            runner: windows-11-arm
            platform: ARM64
            test_platform: ARM64
            package_platform: ARM64
            triplet: arm64-windows
            artifact: windows-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Record runner architecture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts\logs | Out-Null
          @(
            "OS=$([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
            "OSArchitecture=$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
            "ProcessArchitecture=$([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
            "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          ) | Tee-Object artifacts\logs\environment-${{ matrix.platform }}.txt
          if ("${{ matrix.platform }}" -eq "ARM64" -and
              [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne "Arm64") {
            throw "The ARM64 job is not running on a native ARM64 operating system."
          }

      - name: Verify project toolsets
        shell: pwsh
        run: |
          & .\Build\Scripts\Test-ProjectToolsets.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the test pipeline is fail-closed
        shell: pwsh
        run: |
          & .\Build\Scripts\Test-FailClosed.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cache installed dependencies
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Restore pinned dependencies
        shell: pwsh
        run: |
          & .\InstallThirdPartyLibraries.ps1 -Triplet ${{ matrix.triplet }} 2>&1 |
            Tee-Object artifacts\logs\restore-${{ matrix.platform }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Toolchain preflight
        shell: pwsh
        run: |
          & .\Build\Scripts\ToolchainPreflight.ps1 -Platform ${{ matrix.platform }} `
            -Configuration Debug -LogDirectory artifacts\logs -RequireVcpkgComparison 2>&1 |
            Tee-Object artifacts\logs\preflight-${{ matrix.platform }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Debug
        shell: pwsh
        run: |
          msbuild /m CppCoverage.sln /p:Configuration=Debug /p:Platform=${{ matrix.platform }} `
            /bl:artifacts\logs\build-Debug-${{ matrix.platform }}.binlog `
            /fl "/flp:logfile=artifacts\logs\build-Debug-${{ matrix.platform }}.log;verbosity=normal"

      - name: Run tests (Debug)
        shell: pwsh
        run: |
          & .\Build\Scripts\RunTests.ps1 -Platform ${{ matrix.test_platform }} `
            -Configuration Debug -LogDirectory artifacts\logs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        shell: pwsh
        run: |
          msbuild /m CppCoverage.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }} `
            /bl:artifacts\logs\build-Release-${{ matrix.platform }}.binlog `
            /fl "/flp:logfile=artifacts\logs\build-Release-${{ matrix.platform }}.log;verbosity=normal"

      - name: Run tests (Release)
        shell: pwsh
        run: |
          & .\Build\Scripts\RunTests.ps1 -Platform ${{ matrix.test_platform }} `
            -Configuration Release -LogDirectory artifacts\logs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: End-to-end coverage assertion
        shell: pwsh
        run: |
          & .\Build\Scripts\RunEndToEnd.ps1 -Platform ${{ matrix.test_platform }} `
            -Configuration Release -LogDirectory artifacts\logs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and verify
        shell: pwsh
        run: |
          & .\CreateRelease.ps1 -Platform ${{ matrix.package_platform }} -Configuration Release 2>&1 |
            Tee-Object artifacts\logs\package-${{ matrix.platform }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Prove the artifact that ships actually works: run the re-expanded
      # package's own OpenCppCoverage.exe, not the build output. This catches a
      # payload that passes PE scans but is missing a runtime dependency.
      - name: End-to-end coverage assertion (packaged)
        shell: pwsh
        run: |
          $packageRoot = Get-ChildItem artifacts\expanded -Directory |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $packageRoot) { throw "No re-expanded package was found." }
          & .\Build\Scripts\RunEndToEnd.ps1 -Platform ${{ matrix.package_platform }} `
            -Configuration Release -LogDirectory artifacts\logs `
            -PackageRoot $packageRoot -Label packaged 2>&1 |
            Tee-Object artifacts\logs\e2e-packaged-${{ matrix.platform }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # fail-open, this re-reads the recorded results and fails the job when
      # any suite did not fully pass, or when an expected report is missing.
      - name: Verify recorded results
        shell: pwsh
        run: |
          & .\Build\Scripts\Assert-Results.ps1 -Platform ${{ matrix.test_platform }} `
            -LogDirectory artifacts\logs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.artifact }}
          path: artifacts/logs

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: OpenCppCoverage-${{ matrix.artifact }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*-expanded-pe-manifest.json
