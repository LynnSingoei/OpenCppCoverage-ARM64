name: ARM64 compatibility test

on:
  push:
    branches:
      - 'ci/**'
  workflow_dispatch:

jobs:
  compat:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Native ARM64 (v143)
            runner: windows-11-arm
            platform: ARM64
            test_platform: ARM64
            triplet: arm64-windows
            artifact: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify native architecture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts\logs | Out-Null
          $osArch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          "OSArchitecture=$osArch" | Tee-Object artifacts\logs\env-${{ matrix.platform }}.txt
          if ("${{ matrix.platform }}" -eq "ARM64" -and $osArch -ne "Arm64") {
            throw "ARM64 job is not running on a native ARM64 OS (got $osArch)."
          }

      - name: Cache installed dependencies
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}

      - name: Restore pinned dependencies
        shell: pwsh
        run: |
          & .\InstallThirdPartyLibraries.ps1 -Triplet ${{ matrix.triplet }} 2>&1 |
            Tee-Object artifacts\logs\restore-${{ matrix.platform }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Debug with v143 toolset
        shell: pwsh
        run: |
          msbuild /m CppCoverage.sln /p:Configuration=Debug /p:Platform=${{ matrix.platform }} `
            /p:PlatformToolset=v143 `
            /fl "/flp:logfile=artifacts\logs\build-Debug-${{ matrix.platform }}.log;verbosity=normal"

      - name: Run tests
        id: tests
        continue-on-error: true
        shell: pwsh
        run: |
          & .\Build\Scripts\RunTests.ps1 -Platform ${{ matrix.test_platform }} `
            -Configuration Debug -LogDirectory artifacts\logs

      - name: Full test sweep (continue past failures)
        if: matrix.platform == 'ARM64'
        shell: pwsh
        run: |
          $outDir = "ARM64\Debug"
          $exclusions = @("CodeCoverageRunnerTest.OptimizedBuild", "CppCliTest.ManagedUnManagedModule")
          $suites = @(
            @{ Name = "CppCoverageTest";     Args = @("--gtest_filter=-$($exclusions -join ':')") },
            @{ Name = "ExporterTest";        Args = @() },
            @{ Name = "FileFilterTest";      Args = @() },
            @{ Name = "OpenCppCoverageTest"; Args = @() },
            @{ Name = "PluginTest";          Args = @() },
            @{ Name = "ToolsTest";           Args = @() }
          )

          $summary = @()
          foreach ($s in $suites) {
            $exe = Join-Path $outDir "$($s.Name).exe"
            $log = "artifacts\logs\sweep-$($s.Name).log"
            & $exe @($s.Args) 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            $text = Get-Content $log -Raw
            $ran    = if ($text -match '(\d+) tests? from \d+ test suites? ran') { $Matches[1] } else { '?' }
            $passed = if ($text -match '\[  PASSED  \] (\d+) tests?') { $Matches[1] } else { '0' }
            $failedNames = ([regex]::Matches($text, '\[  FAILED  \] ([\w\.]+)') |
                            ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique) -join ', '
            $summary += [pscustomobject]@{
              Suite = $s.Name; ExitCode = $code; Ran = $ran; Passed = $passed; Failed = $failedNames
            }
          }

          "`n================ ARM64 TEST SUMMARY ================"
          $summary | Format-Table -AutoSize | Out-String -Width 200
          $summary | ConvertTo-Json | Set-Content artifacts\logs\arm64-test-summary.json

          $totalRan    = ($summary | Measure-Object -Property Ran -Sum).Sum
          $totalPassed = ($summary | Measure-Object -Property Passed -Sum).Sum
          "TOTAL: $totalPassed passed of $totalRan run"

          $md = "## Native Windows ARM64 test results`n`n"
          $md += "| Suite | Ran | Passed | Failed |`n|---|---|---|---|`n"
          foreach ($r in $summary) {
            $md += "| $($r.Suite) | $($r.Ran) | $($r.Passed) | $(if ($r.Failed) { $r.Failed } else { '-' }) |`n"
          }
          $md += "`n**Total: $totalPassed passed / $totalRan run**`n"
          $md | Set-Content $env:GITHUB_STEP_SUMMARY

      - name: Verify produced binaries are ${{ matrix.platform }}
        if: always()
        shell: pwsh
        run: |
          $outDir = "${{ matrix.platform }}\Debug"
          if (-not (Test-Path $outDir)) { "No output directory $outDir"; exit 0 }
          Get-ChildItem $outDir -Include *.exe,*.dll -Recurse | ForEach-Object {
            $fs = [System.IO.File]::OpenRead($_.FullName)
            $br = New-Object System.IO.BinaryReader($fs)
            $fs.Position = 0x3C
            $peOff = $br.ReadInt32()
            $fs.Position = $peOff + 4
            $machine = $br.ReadUInt16()
            $br.Close()
            $arch = switch ($machine) { 0xAA64 {"ARM64"} 0x8664 {"x64"} 0x14C {"x86"} default {"0x{0:X}" -f $machine} }
            "{0,-45} {1}" -f $_.Name, $arch
          } | Tee-Object artifacts\logs\pe-machine-${{ matrix.platform }}.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-logs-${{ matrix.artifact }}
          path: artifacts/logs
