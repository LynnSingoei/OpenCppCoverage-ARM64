name: Toolchain probe

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-11-arm
            runner: windows-11-arm
          - name: windows-2022
            runner: windows-2022

    steps:
      - name: Report architecture
        shell: pwsh
        run: |
          "OSArchitecture=$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          "ProcessArchitecture=$([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"

      - name: Enumerate MSVC toolsets and ATL/SDK availability
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { $vswhere = "$env:ProgramFiles\Microsoft Visual Studio\Installer\vswhere.exe" }
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          "VS install path: $vsPath"

          "`n=== MSVC toolsets ==="
          Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory | ForEach-Object {
            $atl = Test-Path "$($_.FullName)\atlmfc\include\atlbase.h"
            $targets = (Get-ChildItem "$($_.FullName)\bin\Hostarm64","$($_.FullName)\bin\Hostx64" -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ','
            "{0}  atlbase.h={1}  targets=[{2}]" -f $_.Name, $atl, $targets
          }

          "`n=== ATL libs per architecture (latest toolset) ==="
          $latest = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory | Sort-Object Name | Select-Object -Last 1
          Get-ChildItem "$($latest.FullName)\atlmfc\lib" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { "  lib/$($_.Name)" }

          "`n=== Installed Windows SDKs ==="
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { $_.Name }

          "`n=== VS toolset MSBuild props (v142/v143 presence) ==="
          foreach ($v in 'v142','v143') {
            $p = "$vsPath\MSBuild\Microsoft\VC\$v"
            "{0}: {1}" -f $v, (Test-Path $p)
          }

      - name: Check _CountOneBits64 definition in winnt.h
        shell: pwsh
        run: |
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          Get-ChildItem $sdkRoot -Directory | ForEach-Object {
            $winnt = "$($_.FullName)\um\winnt.h"
            if (Test-Path $winnt) {
              $hits = Select-String -Path $winnt -Pattern '_CountOneBits64' | Select-Object -First 3
              "SDK $($_.Name): _CountOneBits64 references = $(($hits | Measure-Object).Count)"
              $hits | ForEach-Object { "    line $($_.LineNumber): $($_.Line.Trim())" }
            }
          }
