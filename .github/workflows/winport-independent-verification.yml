name: WinPort independent asset verification

# Authored by the WinPort integration session, not by the porting session.
# It never builds the product. It downloads the already-published release asset
# and subjects it to a matched pair of tests across runner families:
#
#   * On native ARM64 hardware the shipped binaries must run and produce a
#     correct coverage report. Only execution can show that.
#   * On x64 hardware the very same binaries must REFUSE to start with
#     ERROR_BAD_EXE_FORMAT (193). A package that runs on x64 is not an ARM64
#     package, so this negative control is what makes the positive result mean
#     something: it rules out an x64 or fat binary passing as ARM64.
#
# Both directions must hold. Either one alone is weak evidence.

on:
  push:
    branches:
      - winport/independent-verification
  workflow_dispatch:
    inputs:
      asset_url:
        description: Published release asset to verify
        required: true
        default: https://github.com/LynnSingoei/OpenCppCoverage-ARM64/releases/download/arm64-81376ba/OpenCppCoverage-0.9.9.0-windows-arm64.zip
      expected_sha256:
        description: Expected SHA-256 of the asset
        required: true
        default: 83f0e1c19d89c534a13a67eef4ebdacb85593aa4696d06ca4925ac03ecfee7a5

permissions:
  contents: read

env:
  ASSET_URL: ${{ github.event.inputs.asset_url || 'https://github.com/LynnSingoei/OpenCppCoverage-ARM64/releases/download/arm64-81376ba/OpenCppCoverage-0.9.9.0-windows-arm64.zip' }}
  EXPECTED_SHA256: ${{ github.event.inputs.expected_sha256 || '83f0e1c19d89c534a13a67eef4ebdacb85593aa4696d06ca4925ac03ecfee7a5' }}

jobs:
  native-arm64:
    name: Native ARM64 - the package must run
    runs-on: windows-11-arm

    steps:
      - name: Assert native ARM64 runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $os = (Get-CimInstance Win32_OperatingSystem).OSArchitecture
          $dotnet = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          "ImageOS=$env:ImageOS"
          "OSArchitecture=$os"
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          "RuntimeInformation.OSArchitecture=$dotnet"
          if ("$dotnet" -ne 'Arm64') { throw "Not a native ARM64 runner: $dotnet" }

      - name: Download published asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Invoke-WebRequest -Uri $env:ASSET_URL -OutFile artifact/package.zip
          "Downloaded $env:ASSET_URL ($((Get-Item artifact/package.zip).Length) bytes)"

      - name: Verify checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (Get-FileHash artifact/package.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = $env:EXPECTED_SHA256.ToLowerInvariant()
          "expected=$expected"
          "actual  =$actual"
          if ($actual -ne $expected) { throw 'Checksum mismatch: refusing to verify unrelated bytes.' }
          'Checksum verified.'

      - name: Expand and inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive artifact/package.zip -DestinationPath expanded -Force
          "Files: $((Get-ChildItem expanded -Recurse -File).Count)"
          $exporter = Join-Path 'expanded' 'Binaries/Plugins/Exporter'
          if (-not (Test-Path $exporter)) { throw 'Binaries\Plugins\Exporter is missing; the product cannot start.' }
          "Plugins\Exporter present with $((Get-ChildItem $exporter -Force -Recurse -File).Count) file(s)"

      - name: Scan every shipped image for PE machine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          $count = 0
          foreach ($f in Get-ChildItem expanded -Recurse -File -Include *.exe, *.dll) {
            $fs = [System.IO.File]::OpenRead($f.FullName)
            try {
              $br = New-Object System.IO.BinaryReader($fs)
              $fs.Position = 0x3C
              $fs.Position = $br.ReadInt32()
              if ($br.ReadUInt32() -ne 0x00004550) { $bad += "$($f.Name): not a PE"; continue }
              $machine = $br.ReadUInt16()
              $count++
              '{0,-40} 0x{1:X4}' -f $f.Name, $machine
              if ($machine -ne 0xAA64) { $bad += ('{0}: 0x{1:X4}' -f $f.Name, $machine) }
            } finally { $fs.Dispose() }
          }
          "Scanned $count image(s)"
          if ($count -eq 0) { throw 'Scanned nothing: the scan cannot pass vacuously.' }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { "VIOLATION $_" }; throw "Non-ARM64 images: $($bad.Count)" }
          'Every shipped image is ARM64 (0xAA64).'

      - name: Compile a coverage fixture with the native toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path fixture | Out-Null
          $src = @(
            '// WinPort independent runtime fixture',
            'int hot(int x) { return x * 2; }',
            'int cold(int x) { return x + 7; }',
            'int main() {',
            '    volatile int r = hot(21);',
            '    return r == 42 ? 0 : 1;',
            '}'
          )
          Set-Content -Path fixture/fixture.cpp -Value $src -Encoding ascii
          Get-Content fixture/fixture.cpp | ForEach-Object -Begin { $i = 0 } -Process { $i++; "{0,3}: {1}" -f $i, $_ }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -prerelease -products * -property installationPath
          if (-not $install) { throw 'No Visual Studio installation found.' }
          "VS: $install"
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvarsall.bat'
          cmd /c "call `"$vcvars`" arm64 >nul && cd fixture && cl /nologo /Zi /Od /EHsc fixture.cpp /Fe:fixture.exe"
          if ($LASTEXITCODE -ne 0) { throw "cl failed with $LASTEXITCODE" }
          Get-ChildItem fixture | Select-Object Name, Length

      - name: Run the shipped OpenCppCoverage against the fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path 'expanded/Binaries/OpenCppCoverage.exe'
          $sources = (Resolve-Path 'fixture').Path
          $target = (Resolve-Path 'fixture/fixture.exe').Path
          "OpenCppCoverage: $exe"
          & $exe --sources $sources --export_type "cobertura:coverage.xml" --working_dir $sources -- $target
          $code = $LASTEXITCODE
          "CoverageExitCode=$code"
          if ($code -ne 0) { throw "The shipped OpenCppCoverage.exe exited $code" }
          if (-not (Test-Path coverage.xml)) { throw 'No cobertura report was produced.' }

      - name: Assert the coverage result is correct
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$report = Get-Content coverage.xml -Raw
          $lines = $report.SelectNodes('//line')
          if (-not $lines -or $lines.Count -eq 0) { throw 'The report contains no line records.' }
          foreach ($l in $lines) { "line {0,3} hits={1}" -f $l.number, $l.hits }

          $hot = $lines | Where-Object { [int]$_.number -eq 2 } | Select-Object -First 1
          $cold = $lines | Where-Object { [int]$_.number -eq 3 } | Select-Object -First 1
          if (-not $hot) { throw 'Line 2 (executed) is absent from the report.' }
          if (-not $cold) { throw 'Line 3 (unreachable) is absent from the report.' }
          if ([int]$hot.hits -lt 1) { throw "Line 2 should be covered but reports $($hot.hits) hits." }
          if ([int]$cold.hits -ne 0) { throw "Line 3 is never called but reports $($cold.hits) hits." }
          'Coverage is correct: the executed line is hit and the unreachable line is not.'
          "ProcessArchitecture=$([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winport-verification-native-arm64
          path: |
            coverage.xml
            fixture/fixture.cpp

  x64-negative-control:
    name: ${{ matrix.runner }} - the package must NOT run
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-latest]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Assert this runner is x64, not ARM64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dotnet = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          "RunnerLabel=${{ matrix.runner }}"
          "ImageOS=$env:ImageOS"
          "OSArchitecture=$((Get-CimInstance Win32_OperatingSystem).OSArchitecture)"
          "RuntimeInformation.OSArchitecture=$dotnet"
          if ("$dotnet" -eq 'Arm64') { throw 'This control is only meaningful on a non-ARM64 runner.' }

      - name: Download and verify the same asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Invoke-WebRequest -Uri $env:ASSET_URL -OutFile artifact/package.zip
          $actual = (Get-FileHash artifact/package.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "bytes=$((Get-Item artifact/package.zip).Length)"
          "actual=$actual"
          if ($actual -ne $env:EXPECTED_SHA256.ToLowerInvariant()) { throw 'Checksum mismatch.' }
          Expand-Archive artifact/package.zip -DestinationPath expanded -Force
          'Checksum verified and package expanded.'

      - name: Confirm the shipped executable is an ARM64 image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'expanded/Binaries/OpenCppCoverage.exe').Path
          $fs = [System.IO.File]::OpenRead($exe)
          try {
            $br = New-Object System.IO.BinaryReader($fs)
            $fs.Position = 0x3C
            $fs.Position = $br.ReadInt32()
            if ($br.ReadUInt32() -ne 0x00004550) { throw 'Not a PE image.' }
            $machine = $br.ReadUInt16()
          } finally { $fs.Dispose() }
          'OpenCppCoverage.exe machine = 0x{0:X4}' -f $machine
          if ($machine -ne 0xAA64) { throw ('Expected 0xAA64, found 0x{0:X4}' -f $machine) }

      - name: The ARM64 binary must refuse to start on x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'expanded/Binaries/OpenCppCoverage.exe').Path
          $started = $false
          $native = $null
          $message = $null
          try {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $exe
            $psi.Arguments = '--help'
            $psi.UseShellExecute = $false
            $p = [System.Diagnostics.Process]::Start($psi)
            $started = $true
            $p.WaitForExit(30000) | Out-Null
            try { $p.Kill() } catch { }
          } catch [System.ComponentModel.Win32Exception] {
            $native = $_.Exception.NativeErrorCode
            $message = $_.Exception.Message
          } catch {
            $message = $_.Exception.Message
          }

          "Started=$started"
          "NativeErrorCode=$native"
          "Message=$message"

          if ($started) {
            throw 'VIOLATION: an ARM64 image started on an x64 runner. The package is not ARM64-only.'
          }
          if ($native -ne 193) {
            throw "Expected ERROR_BAD_EXE_FORMAT (193) but got $native. The failure is not the architecture mismatch we are testing for."
          }
          'Correct: the shipped ARM64 binary is rejected by x64 Windows with ERROR_BAD_EXE_FORMAT (193).'
          'This is what proves the positive ARM64 result is architecture-specific and not an x64 fallback.'
